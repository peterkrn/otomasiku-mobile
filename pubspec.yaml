name: otomasiku_mobile
description: "Otomasiku Marketplace - B2B Industrial Automation"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # i18n
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # Forms
  flutter_form_builder: ^10.3.0+2

  # Typography
  google_fonts: ^6.2.1

  # HTTP client
  dio: ^5.7.0

  # Supabase Auth
  supabase_flutter: ^2.8.4

  # Secure storage (tokens)
  flutter_secure_storage: ^9.2.4

  # Network connectivity
  connectivity_plus: ^6.1.4

  # UUID generation (correlation IDs, idempotency keys)
  uuid: ^4.5.1

  # JSON serialization
  json_annotation: ^4.9.0

  # Firebase
  firebase_core: ^3.13.1
  firebase_crashlytics: ^4.3.5
  firebase_performance: ^0.10.1+5
  firebase_messaging: ^15.2.5

  # Local notifications
  flutter_local_notifications: ^18.0.1

  # Persistent storage (auth state)
  shared_preferences: ^2.3.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.9.5
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  generate: true  # Enable ARB codegen for i18n

  assets:
    - assets/
    - assets/images/
    - assets/images/profile/
    - assets/images/products/
    - assets/images/products/inverter/
    - assets/images/products/plc/
    - assets/images/products/servo/
    - assets/images/products/hmi/
